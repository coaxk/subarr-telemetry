name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege by default: no job here needs to write anything through
# GITHUB_TOKEN. Deploy authenticates to Cloudflare with its own secrets.
permissions:
  contents: read

jobs:
  test:
    name: vitest + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test

  zizmor:
    # Blocking workflow-security audit, matching subarr and subarr-subgen.
    # This repo deploys to Cloudflare on every push to main using stored API
    # credentials, so an unpinned action or an over-broad token here is worth
    # more than in the other two. Pinned to the same version they run so a
    # local run and CI agree.
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install zizmor==1.25.2
      - run: zizmor --persona=regular .github/workflows/
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: deploy to cloudflare
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Migrations BEFORE deploy: new worker code referencing a new column
      # must never go live ahead of its schema (the 2026-06 crashes_json
      # deploy briefly 500'd every ping for exactly this reason). Tracked in
      # d1_migrations, so re-runs are no-ops.
      - name: apply D1 migrations
        run: npx wrangler d1 migrations apply subarr-telemetry --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
